    <div class="search-overlay" data-search-overlay hidden>
        <div class="search-modal" role="dialog" aria-modal="true" aria-label="Search">
            <input type="search" class="search-input" placeholder="Search pages…" autocomplete="off"
                   spellcheck="false" aria-label="Search query" data-search-input>
            <ul class="search-results" data-search-results></ul>
            <p class="search-empty" data-search-empty hidden>No matching pages.</p>
        </div>
    </div>
    <script>
        (function () {
            var overlay = document.querySelector("[data-search-overlay]");
            if (!overlay) return;
            var input = overlay.querySelector("[data-search-input]");
            var list = overlay.querySelector("[data-search-results]");
            var empty = overlay.querySelector("[data-search-empty]");
            var indexUrl = "/search.json";
            var pages = null, loading = false, active = -1;

            function loadIndex() {
                if (pages || loading) return;
                loading = true;
                fetch(indexUrl).then(function (r) { return r.json(); }).then(function (data) {
                    pages = data;
                    if (overlay.getAttribute("hidden") === null) render(input.value);
                }).catch(function () { loading = false; });
            }

            function score(page, q) {
                var title = (page.title || "").toLowerCase();
                var tags = (page.tags || []).join(" ").toLowerCase();
                var content = (page.content || "").toLowerCase();
                if (title.indexOf(q) === 0) return 4;
                if (title.indexOf(q) !== -1) return 3;
                if (tags.indexOf(q) !== -1) return 2;
                if (content.indexOf(q) !== -1) return 1;
                return 0;
            }

            function render(query) {
                var q = query.trim().toLowerCase();
                list.innerHTML = "";
                active = -1;
                if (!q) { empty.setAttribute("hidden", ""); return; }
                if (!pages) { loadIndex(); return; }
                var matches = pages.map(function (p) { return { p: p, s: score(p, q) }; })
                    .filter(function (m) { return m.s > 0; })
                    .sort(function (a, b) { return b.s - a.s || a.p.title.localeCompare(b.p.title); })
                    .slice(0, 12);
                if (!matches.length) { empty.removeAttribute("hidden"); return; }
                empty.setAttribute("hidden", "");
                matches.forEach(function (m) {
                    var li = document.createElement("li");
                    var a = document.createElement("a");
                    a.href = m.p.url;
                    a.className = "search-result";
                    a.textContent = m.p.title;
                    li.appendChild(a);
                    list.appendChild(li);
                });
            }

            function setActive(next) {
                var items = list.querySelectorAll(".search-result");
                if (!items.length) return;
                if (active >= 0 && items[active]) items[active].classList.remove("is-active");
                active = (next + items.length) % items.length;
                items[active].classList.add("is-active");
                items[active].scrollIntoView({ block: "nearest" });
            }

            function open() {
                overlay.removeAttribute("hidden");
                document.body.classList.add("search-open");
                input.value = "";
                render("");
                loadIndex();
                input.focus();
            }
            function close() {
                overlay.setAttribute("hidden", "");
                document.body.classList.remove("search-open");
            }

            document.querySelectorAll("[data-search-open]").forEach(function (btn) {
                btn.addEventListener("click", open);
            });
            input.addEventListener("input", function () { render(input.value); });
            overlay.addEventListener("mousedown", function (e) {
                if (e.target === overlay) close();
            });
            input.addEventListener("keydown", function (e) {
                var items = list.querySelectorAll(".search-result");
                if (e.key === "ArrowDown") { e.preventDefault(); setActive(active + 1); }
                else if (e.key === "ArrowUp") { e.preventDefault(); setActive(active - 1); }
                else if (e.key === "Enter") {
                    if (active >= 0 && items[active]) { window.location.href = items[active].href; }
                    else if (items[0]) { window.location.href = items[0].href; }
                }
            });
            document.addEventListener("keydown", function (e) {
                var isOpen = overlay.getAttribute("hidden") === null;
                if (e.key === "Escape" && isOpen) { close(); return; }
                var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) ||
                    document.activeElement.isContentEditable;
                if (!isOpen && !typing && (e.key === "/" ||
                    ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"))) {
                    e.preventDefault();
                    open();
                }
            });
        })();
    </script>
